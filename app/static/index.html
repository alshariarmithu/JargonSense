<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title >JargonSense</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button class="icon-btn theme-float" id="theme-toggle" type="button"
        aria-label="Switch colour theme">
  <span id="theme-icon">◐</span><span id="theme-label">Theme</span>
</button>

<main class="shell">

  <!-- ==================================== title + input -->
  <section class="masthead">
    <h1 class="hero-title">JargonSense</h1>

    <div class="search">
      <textarea id="predict-text"
                aria-label="Developer communication to classify"
                >Kill the process before restarting the server.</textarea>
      <div class="search-actions">
        <button class="btn" id="predict-go" type="button">Classify</button>
        <div class="search-meta">
          <span class="hint mono" id="predict-status"></span>
          <span class="hint mono kbd-hint">Ctrl + Enter</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ========================================== results -->
  <section class="section" id="sec-result">
    <div class="card" id="predict-out" hidden>
      <div class="card-head">
        <h2>Result</h2>
        <span class="verdict" id="predict-verdict"></span>
      </div>
      <div class="grid-2 wide-left">
        <div>
          <h3>Token contributions</h3>
          <div class="sentence" id="predict-sentence"></div>
          <div class="legend" id="predict-legend"></div>
          <p class="hint mono" id="predict-note" style="margin-top:10px"></p>
        </div>
        <div>
          <h3>Class probabilities</h3>
          <div class="bars" id="predict-bars"></div>
          <p class="hint" id="predict-expect" style="margin-top:14px"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ========================================= examples -->
  <section class="section" id="sec-examples">
    <div class="section-head">
      <h2>Examples</h2>
      <p class="hint">
        Click any card to load it into the classifier. The jargon examples are
        all genuinely neutral — a general-purpose lexicon reads most of them
        as hostile.
      </p>
    </div>
    <div id="examples"></div>
  </section>

</main>
<script src="app.js"></script>
</body>
</html>
