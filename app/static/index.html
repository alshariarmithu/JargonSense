<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SE Sentiment Classifier</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="brand-mark">SE</div>
      <div class="brand-text">
        <h1>SE Sentiment Classifier</h1>
        <p>TF-IDF (1,3) + calibrated Linear SVM</p>
      </div>
    </div>
  </div>
</header>

<main class="shell">
  <section class="view active">
    <div class="card">
      <div class="card-head">
        <h2>Classify developer communication</h2>
        <span class="badge slow">LIME</span>
      </div>
      <textarea id="predict-text">Kill the process before restarting the server.</textarea>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="predict-go">Classify</button>
      </div>
      <div class="chipset" id="examples" style="margin-top:12px"></div>
    </div>

    <div class="card" id="predict-out" hidden>
      <div class="card-head">
        <h2>Prediction</h2>
        <span class="verdict" id="predict-verdict"></span>
      </div>
      <div class="grid-2">
        <div>
          <h3>Token contributions</h3>
          <div class="sentence" id="predict-sentence"></div>
        </div>
        <div>
          <h3>Class probabilities</h3>
          <div class="bars" id="predict-bars"></div>
          <p class="hint" id="predict-note" style="margin-top:14px"></p>
        </div>
      </div>
    </div>

    <div class="grid-3" id="metrics" style="margin-top:16px"></div>

    <div class="card">
      <div class="card-head"><h2>Stress-test performance</h2></div>
      <div class="table-wrap"><table id="stress-table"><thead></thead><tbody></tbody></table></div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
